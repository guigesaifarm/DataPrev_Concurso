<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Interativos: Ingestão e Integração de Dados (ETL/ELT)</title>
    <style>
        :root {
            /* Paleta de Cores Inspirada na Seleção da Espanha (Vermelho, Amarelo e Azul Escuro) */
            --bg-color: #FBF6F6;
            --card-bg: #FFFFFF;
            --card-border: #E8D0D0;

            --primary-color: #AA151B;   /* Vermelho da Espanha (La Roja) */
            --accent-gold: #F1BF00;     /* Amarelo Ouro */
            --accent-dark: #002855;     /* Azul Escuro / Marinho */

            --text-color: #1A1A1A;
            --text-muted: #665C5C;

            --shadow: 0 12px 30px rgba(170, 21, 27, 0.1);
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
        }

        .tracker {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-dark);
            margin-bottom: 20px;
            background: rgba(241, 191, 0, 0.25);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(241, 191, 0, 0.5);
        }

        /* Flashcard Container */
        .scene {
            width: 100%;
            max-width: 680px;
            height: 400px;
            perspective: 1200px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--border-radius);
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px;
            border: 1px solid var(--card-border);
            overflow-y: auto;
        }

        .card-face-front {
            background: linear-gradient(145deg, #FFFFFF, #FFF9F9);
            border-top: 5px solid var(--primary-color);
        }

        .card-face-back {
            background: linear-gradient(145deg, #FFFDF0, #FFFFFF);
            transform: rotateY(180deg);
            border-top: 5px solid var(--accent-gold);
        }

        .card-category {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .card-face-back .card-category {
            color: var(--accent-dark);
        }

        .card-content {
            font-size: 1.35rem; 
            line-height: 1.6;
            color: var(--text-color);
            font-weight: 500;
            text-align: center;
            margin: auto 0;
        }

        .card-face-back .card-content {
            color: var(--text-color);     
            font-size: 1.05rem; 
            text-align: left;
        }

        .card-face-back .card-content b {
            color: var(--primary-color);
            background: rgba(241, 191, 0, 0.25);
            padding: 2px 5px;
            border-radius: 4px;
        }

        .card-hint {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: var(--card-bg);
            color: var(--accent-dark);
            border: 1px solid var(--card-border);
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(170, 21, 27, 0.08);
            user-select: none;
        }

        button:hover {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(170, 21, 27, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* Scrollbar custom styles */
        .card-face::-webkit-scrollbar {
            width: 6px;
        }
        .card-face::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 10px;
        }
        .card-face::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 10px;
        }

        @media (max-width: 640px) {
            .scene {
                height: 440px;
            }
            header h1 {
                font-size: 1.6rem;
            }
            .card-content {
                font-size: 1.15rem;
            }
            .card-face-back .card-content {
                font-size: 0.95rem;
            }
            button {
                padding: 10px 18px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Flashcards Interativos</h1>
        <p>ETL / ELT • Transferência de Arquivos • Integração via Banco de Dados</p>
    </header>

    <div class="tracker" id="card-tracker">Card 1 de 40</div>

    <div class="scene" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card-face card-face-front">
                <div class="card-category" id="card-category">Categoria</div>
                <div class="card-content" id="card-front">Carregando pergunta...</div>
                <div class="card-hint">💡 Clique no card para ver a resposta</div>
            </div>
            <div class="card-face card-face-back">
                <div class="card-category">Resposta Explicada</div>
                <div class="card-content" id="card-back">Carregando resposta...</div>
                <div class="card-hint">💡 Clique para virar novamente</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()">Anterior</button>
        <button onclick="flipCard()">Virar Card</button>
        <button onclick="nextCard()">Próximo</button>
    </div>

    <script>
    const cardsData = [
        // --- 1. CONCEITOS DE INGESTÃO E ETL/ELT (20 CARDS) ---
        {
            category: "ETL vs ELT",
            front: "O que significa a sigla **ETL** no contexto de dados?",
            back: "Significa **Extract, Transform, Load** (Extrair, Transformar e Carregar). É o processo tradicional onde os dados são limpos e transformados *antes* de serem salvos no destino final."
        },
        {
            category: "ETL vs ELT",
            front: "O que significa a sigla **ELT**?",
            back: "Significa **Extract, Load, Transform** (Extrair, Carregar e Transformar). Os dados brutos são carregados primeiro no destino (como um Data Lake) e a transformação ocorre depois dentro da própria plataforma."
        },
        {
            category: "Ingestão de Dados",
            front: "O que é a fase de **Extração** em um pipeline de integração?",
            back: "O processo de **coleta de dados de fontes dispersas** (bancos relacionais, APIs, logs, arquivos) para enviá-los ao sistema centralizado."
        },
        {
            category: "Transformação",
            front: "Qual é o objetivo principal da etapa de **Transformação** de dados?",
            back: "Garantir a **qualidade, padronização e consistência** dos dados (limpeza de nulos, conversão de tipos, remoção de duplicatas, união de tabelas)."
        },
        {
            category: "Carga",
            front: "O que é a fase de **Carga (*Load*)** em um fluxo de dados?",
            back: "O armazenamento final dos dados processados em um repositório analítico estruturado, como um **Data Warehouse ou Data Mart**."
        },
        {
            category: "Vantagem do ELT",
            front: "Por que o modelo **ELT** ganhou tanta popularidade com a chegada do Cloud Computing?",
            back: "Porque aproveita o **poder computacional escalável da nuvem** (ex: Snowflake, BigQuery) para processar transformações complexas de forma veloz após a carga bruta."
        },
        {
            category: "Batch vs Streaming",
            front: "Qual a diferença entre **Ingestão em Lote (*Batch*)** e **Ingestão em Tempo Real (*Streaming*)**?",
            back: "• **Batch:** Os dados são coletados e processados em intervalos programados (ex: toda noite).<br>• **Streaming:** Os dados são ingeridos e processados continuamente à medida que são gerados."
        },
        {
            category: "Data Warehouse",
            front: "Qual é o papel tradicional de um **Data Warehouse** em arquiteturas de ETL?",
            back: "Servir como repositório central otimizado para consultas analíticas complexas e relatórios de inteligência de negócios (BI)."
        },
        {
            category: "Data Lake",
            front: "Como o **Data Lake** se diferencia de um Data Warehouse na ingestão?",
            back: "O Data Lake aceita **dados em seu formato bruto** (estruturados, semi e não estruturados) a baixo custo, ideal para a abordagem ELT."
        },
        {
            category: "CDC (Change Data Capture)",
            front: "O que é a técnica **CDC (Change Data Capture)** na extração de dados?",
            back: "Uma técnica que identifica e captura apenas **as alterações (INSERT, UPDATE, DELETE)** ocorridas em uma base de dados desde a última sincronização, economizando rede e tempo."
        },
        {
            category: "Orquestração",
            front: "Qual é a função de uma ferramenta de **Orquestração de Pipelines** (ex: Apache Airflow)?",
            back: "Agendar, monitorar, gerenciar dependências e garantir que as etapas de um fluxo ETL/ELT rodem na **ordem correta e com alertas de falhas**."
        },
        {
            category: "Data Quality",
            front: "Por que as verificações de **Qualidade de Dados (*Data Quality*)** são essenciais na ingestão?",
            back: "Para evitar o problema do *Garbage In, Garbage Out* (Entra lixo, sai lixo), bloqueando dados corrompidos ou inconsistentes antes que alcancem os relatórios gerenciais."
        },
        {
            category: "Idempotência",
            front: "O que significa um pipeline de dados ser **idempotente**?",
            back: "Significa que executar o mesmo processo de ingestão várias vezes com os mesmos dados **produzirá o mesmo resultado final**, sem duplicar registros indevidamente."
        },
        {
            category: "Incremental vs Full",
            front: "Diferencie carga **Full (Completa)** de carga **Incremental**.",
            back: "• **Full:** Apaga e recarrega todos os dados do zero a cada execução.<br>• **Incremental:** Ingerir apenas os novos dados ou modificados desde a última execução."
        },
        {
            category: "Staging Area",
            front: "O que é a **Área de Staging (*Staging Area*)** em processos ETL?",
            back: "Uma tabela ou banco temporário intermediário onde os dados extraídos são depositados antes de sofrerem as transformações finais."
        },
        {
            category: "Normalização",
            front: "Por que dados transacionais normalizados precisam ser desnormalizados no destino analítico?",
            back: "Para **otimizar a performance de consultas de leitura** em dashboards, reduzindo a necessidade de JOINs complexos."
        },
        {
            category: "APIs e Conectores",
            front: "O que são **Conectores Nativos** em ferramentas de integração de dados?",
            back: "Módulos pré-construídos que facilitam a extração de dados de plataformas populares (como Salesforce, GA4, ERPs) sem precisar codificar integrações do zero."
        },
        {
            category: "Latência de Dados",
            front: "O que define o conceito de **SLAs de Ingestão de Dados**?",
            back: "O tempo máximo aceitável para que um dado gerado na fonte esteja disponível para análise no destino (frequentemente medido em segundos, horas ou dias)."
        },
        {
            category: "Governança",
            front: "O que é **Lineage de Dados (*Data Lineage*)** em pipelines de integração?",
            back: "O mapeamento visual completo da **trilha percorrida pelo dado**, mostrando sua origem, cada transformação sofrida e onde ele foi consumido."
        },
        {
            category: "Desafios de Ingestão",
            front: "Cite dois grandes desafios enfrentados ao projetar pipelines de integração de dados em larga escala.",
            back: "Flutuação de volume de tráfego e tratamento de falhas de rede em fontes externas instáveis."
        },

        // --- 2. TRANSFERÊNCIA DE ARQUIVOS E INTEGRAÇÃO VIA BANCO DE DADOS (20 CARDS) ---
        {
            category: "Transferência de Arquivos",
            front: "Quais são os protocolos padrão mais seguros utilizados para **transferência de arquivos** corporativos?",
            back: "• **SFTP** (SSH File Transfer Protocol)<br>• **FTPS** (FTP over SSL)<br>• **AS2** (para transações B2B seguras)."
        },
        {
            category: "Formatos de Arquivo",
            front: "Quais formatos de arquivos são mais eficientes para leitura analítica em larga escala comparados ao CSV tradicional?",
            back: "Formatos colunares compactados como **Parquet e ORC**, que reduzem espaço em disco e aceleram buscas."
        },
        {
            category: "Integração via Banco",
            front: "O que é **Integração via Banco de Dados Direta**?",
            back: "Técnica onde sistemas diferentes compartilham dados acessando diretamente tabelas de transação, views ou usando links de banco (*database links*)."
        },
        {
            category: "Riscos da Integração via BD",
            front: "Por que a integração direta via tabelas de banco de dados é frequentemente desencorajada por arquitetos?",
            back: "Porque **acopla fortemente os sistemas**, de modo que mudar a estrutura de uma tabela em um sistema pode quebrar o outro aplicativo integrado."
        },
        {
            category: "Database Views",
            front: "Como o uso de **Views de Banco de Dados** ajuda na integração segura entre sistemas?",
            back: "Permite expor apenas um subconjunto seguro e formatado de dados para aplicativos externos, **ocultando tabelas internas e regras sensíveis**."
        },
        {
            category: "ETL via SQL",
            front: "O que são **Stored Procedures** aplicadas à integração de dados?",
            back: "Rotinas de código SQL executadas diretamente no SGBD de destino para transformar e consolidar dados de tabelas de stage de forma nativa."
        },
        {
            category: "Polling de Arquivos",
            front: "O que é o mecanismo de **Polling** na transferência automatizada de arquivos?",
            back: "Um processo que verifica periodicamente (ex: a cada 5 minutos) se um diretório de arquivos possui novos documentos para iniciar a ingestão."
        },
        {
            category: "Webhooks",
            front: "Como os **Webhooks** diferem do Polling tradicional de arquivos/dados?",
            back: "O Webhook usa uma abordagem orientada a eventos: **a fonte avisa ativamente o sistema receptor** assim que um novo dado é gerado, eliminando esperas."
        },
        {
            category: "Staging de Arquivos",
            front: "Por que grandes lotes de arquivos CSV/JSON geralmente passam por um Object Storage (como Amazon S3) antes de irem para o Data Warehouse?",
            back: "Porque servem como um **buffer confiável e de baixo custo** para carregar lotes massivos em paralelo (*bulk load*)."
        },
        {
            category: "Banco de Staging",
            front: "O que é uma estratégia de **Staging Database** dedicada?",
            back: "Um banco isolado apenas para receber dados brutos de fontes externas sem impactar a performance do banco de produção principal (*OLTP*)."
        },
        {
            category: "Duplicidade de Arquivos",
            front: "Como evitar o reprocessamento acidental de arquivos antigos em uma rotina automatizada de ingestão?",
            back: "Implementando rotinas que **movem ou renomeiam os arquivos processados** para pastas de histórico (`processed/` ou `archive/`) após a leitura."
        },
        {
            category: "Replicação de BD",
            front: "O que é a **Replicação de Banco de Dados** (Master-Slave / Read Replica)?",
            back: "Técnica de sincronização contínua onde o banco de leitura é atualizado em tempo real copiando as transações do banco principal."
        },
        {
            category: "ETL vs Mensageria",
            front: "Como sistemas de mensageria em tempo real (como **Apache Kafka**) mudaram a integração via arquivos/banco?",
            back: "Permitem a **transmissão contínua de eventos baseados em filas**, eliminando a necessidade de ler arquivos em lote baseados em tempo."
        },
        {
            category: "Validação de Schema",
            front: "Por que validar o **esquema de arquivos recebidos** (ex: colunas esperadas em um CSV) é vital na ingestão?",
            back: "Para evitar que alterações não comunicadas na fonte quebrem silenciosamente os relatórios e modelos analíticos posteriores."
        },
        {
            category: "Bulk Insert",
            front: "O que é a operação de **Bulk Insert** em bancos de dados?",
            back: "Um comando otimizado para **inserir milhões de linhas de uma só vez** a partir de um arquivo externo, evitando o alto custo de inserções linha por linha."
        },
        {
            category: "Segurança de Arquivos",
            front: "Quais cuidados de segurança devem ser tomados ao transferir arquivos sensíveis via SFTP?",
            back: "Uso obrigatório de **chaves SSH criptografadas** em vez de senhas simples e restrição rígida de endereços IP de origem (*firewall*)."
        },
        {
            category: "ETL de Arquivos Grandes",
            front: "O que é processamento em **Chunks (Lotes/Fatias)** ao ler arquivos gigantescos?",
            back: "Técnica de ler e processar o arquivo em partes menores na memória, evitando estouro de memória RAM (*Out of Memory*)."
        },
        {
            category: "Tratamento de Erros",
            front: "O que é uma **Dead Letter Queue (DLQ)** em integrações de dados?",
            back: "Uma fila especial para onde são direcionados os registros ou arquivos que **falharam no processamento**, permitindo auditoria sem travar o pipeline principal."
        },
        {
            category: "APIs vs Transferência",
            front: "Em que cenário a transferência de arquivos em lote ainda supera a integração moderna via APIs REST?",
            back: "Na transmissão de **volumes massivos de dados históricos ou pesados**, onde chamadas de API iterativas seriam lentas e gerariam overhead de rede."
        },
        {
            category: "Consistência Eventual",
            front: "O que significa **Consistência Eventual** em arquiteturas de integração assíncrona?",
            back: "Significa que os dados replicados entre sistemas podem demorar alguns instantes para sincronizar, mas **eventualmente estarão idênticos** em todas as pontas."
        }
    ];

    let currentIndex = 0;
    const cardElement = document.getElementById('flashcard');
    const categoryElement = document.getElementById('card-category');
    const frontElement = document.getElementById('card-front');
    const backElement = document.getElementById('card-back');
    const trackerElement = document.getElementById('card-tracker');

    function parseFormatting(str) {
        return str.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
    }

    function updateCard() {
        cardElement.classList.remove('is-flipped');
        setTimeout(() => {
            const currentData = cardsData[currentIndex];
            categoryElement.innerText = currentData.category;
            frontElement.innerHTML = parseFormatting(currentData.front);
            backElement.innerHTML = parseFormatting(currentData.back);
            trackerElement.innerText = `Card ${currentIndex + 1} de ${cardsData.length}`;
        }, 150);
    }

    function flipCard() {
        cardElement.classList.toggle('is-flipped');
    }

    function nextCard() {
        currentIndex = (currentIndex + 1) % cardsData.length;
        updateCard();
    }

    function prevCard() {
        currentIndex = (currentIndex - 1 + cardsData.length) % cardsData.length;
        updateCard();
    }

    // Initialize App
    updateCard();

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') nextCard();
        if (e.key === 'ArrowLeft') prevCard();
        if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            flipCard();
        }
    });
    </script>
</body>
</html>
