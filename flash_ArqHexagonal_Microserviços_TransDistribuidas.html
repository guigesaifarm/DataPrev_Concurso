<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Interativos: Arquitetura Hexagonal, Microsserviços & Transações Distribuídas</title>
    <style>
        :root {
            /* Paleta de Cores Inspirada na Seleção dos Emirados Árabes Unidos (Vermelho, Verde, Branco e Preto) */
            --bg-color: #F7F8FA;
            --card-bg: #FFFFFF;
            --card-border: #E2E8F0;

            --primary-color: #CE1126;   /* Vermelho Tradicional dos Emirados */
            --accent-green: #00732F;    /* Verde Esmeralda */
            --accent-dark: #1A202C;     /* Preto / Cinza Escuro de Suporte */

            --text-color: #1A202C;
            --text-muted: #4A5568;

            --shadow: 0 12px 30px rgba(206, 17, 38, 0.1);
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
        }

        .tracker {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 20px;
            background: rgba(0, 115, 47, 0.08);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(0, 115, 47, 0.3);
        }

        /* Flashcard Container */
        .scene {
            width: 100%;
            max-width: 680px;
            height: 400px;
            perspective: 1200px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--border-radius);
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px;
            border: 1px solid var(--card-border);
            overflow-y: auto;
        }

        .card-face-front {
            background: linear-gradient(145deg, #FFFFFF, #FAFBFB);
            border-top: 5px solid var(--primary-color);
        }

        .card-face-back {
            background: linear-gradient(145deg, #F4FBF7, #FFFFFF);
            transform: rotateY(180deg);
            border-top: 5px solid var(--accent-green);
        }

        .card-category {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .card-face-back .card-category {
            color: var(--accent-green);
        }

        .card-content {
            font-size: 1.35rem; 
            line-height: 1.6;
            color: var(--text-color);
            font-weight: 500;
            text-align: center;
            margin: auto 0;
        }

        .card-face-back .card-content {
            color: var(--text-color);     
            font-size: 1.05rem; 
            text-align: left;
        }

        .card-face-back .card-content b {
            color: var(--accent-green);
            background: rgba(0, 115, 47, 0.1);
            padding: 2px 5px;
            border-radius: 4px;
        }

        .card-hint {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: var(--card-bg);
            color: var(--primary-color);
            border: 1px solid var(--card-border);
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(206, 17, 38, 0.08);
            user-select: none;
        }

        button:hover {
            background-color: var(--primary-color);
            color: #FFFFFF;
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(206, 17, 38, 0.25);
        }

        button:active {
            transform: translateY(0);
        }

        /* Scrollbar custom styles */
        .card-face::-webkit-scrollbar {
            width: 6px;
        }
        .card-face::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 10px;
        }
        .card-face::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 10px;
        }

        @media (max-width: 640px) {
            .scene {
                height: 440px;
            }
            header h1 {
                font-size: 1.6rem;
            }
            .card-content {
                font-size: 1.15rem;
            }
            .card-face-back .card-content {
                font-size: 0.95rem;
            }
            button {
                padding: 10px 18px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Flashcards Interativos</h1>
        <p>Arquitetura Hexagonal, Microsserviços, Containers & Transações Distribuídas</p>
    </header>

    <div class="tracker" id="card-tracker">Card 1 de 40</div>

    <div class="scene" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card-face card-face-front">
                <div class="card-category" id="card-category">Categoria</div>
                <div class="card-content" id="card-front">Carregando pergunta...</div>
                <div class="card-hint">💡 Clique no card para ver a resposta</div>
            </div>
            <div class="card-face card-face-back">
                <div class="card-category">Resposta Explicada</div>
                <div class="card-content" id="card-back">Carregando resposta...</div>
                <div class="card-hint">💡 Clique para virar novamente</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()">Anterior</button>
        <button onclick="flipCard()">Virar Card</button>
        <button onclick="nextCard()">Próximo</button>
    </div>

    <script>
    const cardsData = [
        // --- 1. ARQUITETURA HEXAGONAL (10 CARDS) ---
        {
            category: "Hexagonal",
            front: "O que é a **Arquitetura Hexagonal** (também conhecida como Ports and Adapters)?",
            back: "Um padrão de design de software criado por Alistair Cockburn que isola a lógica de negócio (núcleo) de preocupações externas, como banco de dados e interfaces."
        },
        {
            category: "Hexagonal",
            front: "Qual é o principal objetivo de negócio da Arquitetura Hexagonal?",
            back: "Permitir que a aplicação seja **testada e mantida de forma independente** de frameworks, bancos de dados ou dispositivos externos."
        },
        {
            category: "Hexagonal",
            front: "O que compõe o **Domínio / Núcleo (*Core*)** em uma arquitetura hexagonal?",
            back: "As regras de negócio puras da aplicação, completamente livres de dependências de bibliotecas externas, frameworks ou infraestrutura."
        },
        {
            category: "Hexagonal",
            front: "O que são as **Portas (*Ports*)** na arquitetura hexagonal?",
            back: "Interfaces formais (contratos em código) que definem como o mundo externo pode interagir com o núcleo ou como o núcleo interage com serviços externos."
        },
        {
            category: "Hexagonal",
            front: "O que são os **Adaptadores (*Adapters*)**?",
            back: "Componentes que convertem chamadas de fora para o formato esperado pelas Portas (ou vice-versa), como controladores REST ou mapeadores de banco de dados."
        },
        {
            category: "Hexagonal",
            front: "Qual a diferença entre **Portas Primárias (Driving)** e **Portas Secundárias (Driven)**?",
            back: "• **Primárias (Entrada):** Acionadas por usuários ou sistemas externos (ex: APIs, CLI).<br>• **Secundárias (Saída):** Acionadas pelo núcleo para acessar serviços externos (ex: ORM, filas)."
        },
        {
            category: "Hexagonal",
            front: "Como a Arquitetura Hexagonal facilita os **testes automatizados**?",
            back: "Permite testar toda a regra de negócio em memória criando **mocks das portas secundárias**, sem precisar subir banco de dados ou servidores."
        },
        {
            category: "Hexagonal",
            front: "O que é a regra da **Inversão de Dependência** aplicada na arquitetura hexagonal?",
            back: "O núcleo define as interfaces (portas) que precisa, e os adaptadores de infraestrutura implementam essas interfaces, invertendo o fluxo tradicional de dependência."
        },
        {
            category: "Hexagonal",
            front: "Como a arquitetura hexagonal lida com a **troca de frameworks ou bancos de dados**?",
            back: "De forma simples e barata: basta reescrever ou trocar o **adaptador** correspondente, sem modificar nenhuma linha de código do domínio principal."
        },
        {
            category: "Hexagonal",
            front: "Por que o nome 'Hexagonal' se o diagrama não precisa ter exatamente seis lados?",
            back: "O formato geométrico foi apenas uma licença visual de Alistair Cockburn para enfatizar que o núcleo possui **várias faces ou pontos de contato** com o exterior."
        },

        // --- 2. MICROSSERVIÇOS: ORQUESTRAÇÃO E API GATEWAY (10 CARDS) ---
        {
            category: "Microsserviços",
            front: "O que define um sistema baseado em **Microsserviços**?",
            back: "Uma abordagem arquitetural onde uma aplicação é construída como um conjunto de **pequenos serviços independentes**, executando seus próprios processos e comunicando-se via rede."
        },
        {
            category: "Orquestração vs Coreografia",
            front: "Qual a diferença entre **Orquestração** e **Coreografia** na comunicação de microsserviços?",
            back: "• **Orquestração:** Há um coordenador central (*Manager*) que comanda o fluxo de passos.<br>• **Coreografia:** Os serviços reagem de forma descentralizada a eventos disparados por outros."
        },
        {
            category: "API Gateway",
            front: "Qual é a principal função de um **API Gateway** em arquiteturas de microsserviços?",
            back: "Atuar como um ponto de entrada único para todos os clientes, gerenciando **roteamento, autenticação, controle de taxa (*rate limiting*) e agregação de respostas**."
        },
        {
            category: "BFF Pattern",
            front: "O que é o padrão **BFF (Backend For Frontend)** em microsserviços?",
            back: "A criação de gateways ou backends especializados dedicados a um tipo específico de cliente (ex: um BFF separado para aplicativo mobile e outro para web)."
        },
        {
            category: "Descoberta de Serviços",
            front: "Por que o mecanismo de **Service Discovery (Descoberta de Serviços)** é vital em microsserviços?",
            back: "Porque em ambientes elásticos, os endereços IP dos containers mudam constantemente; o Discovery mapeia dinamicamente onde cada serviço está rodando."
        },
        {
            category: "Circuit Breaker",
            front: "O que o padrão **Circuit Breaker** protege em uma arquitetura de microsserviços?",
            back: "Evita o efeito cascata de falhas, interrompendo temporariamente chamadas a um serviço instável e retornando uma resposta padrão (*fallback*)."
        },
        {
            category: "Service Mesh",
            front: "O que é uma **Service Mesh** (como Istio ou Linkerd)?",
            back: "Uma camada de infraestrutura dedicada que gerencia a comunicação segura, observável e resiliente entre microsserviços através de *sidecar proxies*."
        },
        {
            category: "Banco por Microsserviço",
            front: "Qual é a regra de ouro sobre o armazenamento de dados em microsserviços puros?",
            back: "O padrão **Database-per-Service**: cada microsserviço deve possuir seu próprio banco de dados isolado para garantir autonomia e evitar acoplamento forte."
        },
        {
            category: "Acoplamento Temporal",
            front: "Por que microsserviços preferem comunicação assíncrona (filas/eventos) em vez de chamadas HTTP síncronas em cadeia?",
            back: "Para eliminar o **acoplamento temporal**, garantindo que se um serviço cair, os outros continuem operando sem travar as requisições."
        },
        {
            category: "Complexidade Distribuída",
            front: "Qual é o principal ônus de adotar uma arquitetura de microsserviços?",
            back: "A alta **complexidade operacional**, exigindo forte automação de deploy, monitoramento distribuído (tracing) e gestão de rede."
        },

        // --- 3. CONTAINERS (10 CARDS) ---
        {
            category: "Containers",
            front: "O que é um **Container** de software (como Docker)?",
            back: "Uma unidade leve, autônoma e executável de software que empacota o código e todas as suas dependências para rodar de forma isolada em qualquer ambiente."
        },
        {
            category: "Containers vs Máquinas Virtuais",
            front: "Qual é a diferença fundamental de arquitetura entre um **Container** e uma **Máquina Virtual (VM)**?",
            back: "As VMs emulam um sistema operacional inteiro com kernel próprio; os **containers compartilham o kernel do sistema operacional hospedeiro**, sendo muito mais leves."
        },
        {
            category: "Dockerfile",
            front: "O que é um **Dockerfile**?",
            back: "Um arquivo de texto contendo todas as instruções de comandos em ordem sequencial necessárias para **construir uma imagem de container**."
        },
        {
            category: "Imagens vs Containers",
            front: "Qual a diferença entre uma **Imagem Docker** e um **Container Docker**?",
            back: "• **Imagem:** O modelo estático, somente leitura, com o pacote do software.<br>• **Container:** A instância em execução daquela imagem na memória."
        },
        {
            category: "Orquestração com Kubernetes",
            front: "O que faz o **Kubernetes (K8s)** no ecossistema de containers?",
            back: "Orquestra a automação, implantação, escalabilidade, balanceamento de carga e gerenciamento de milhares de containers em clusters."
        },
        {
            category: "Pods no Kubernetes",
            front: "O que é um **Pod** no Kubernetes?",
            back: "A menor unidade de computação implantável no Kubernetes, que pode conter **um ou mais containers** que compartilham armazenamento e rede."
        },
        {
            category: "Imutabilidade de Infra",
            front: "Como os containers promovem o conceito de **Infraestrutura Imutável**?",
            back: "Em vez de corrigir um servidor corrompido em produção, destrói-se o container e sobe-se um **novo container idêntico limpo** a partir da imagem original."
        },
        {
            category: "Volumes de Dados",
            front: "Como os containers lidam com a **persistência de dados** já que são efêmeros?",
            back: "Através de **Volumes e Persistent Volumes**, que desacoplam o ciclo de vida dos dados do ciclo de vida do próprio container."
        },
        {
            category: "Portability",
            front: "O que garante que um container rode perfeitamente no notebook do desenvolvedor e na nuvem corporativa?",
            back: "O **isolamento de recursos de sistema** (Namespaces e Cgroups do Linux), encapsulando todas as dependências de biblioteca."
        },
        {
            category: "Container Registry",
            front: "Qual é a função de um **Container Registry** (como Docker Hub ou ECR)?",
            back: "Armazenar, versionar e gerenciar a distribuição segura de **imagens de containers** para download e deploy automatizado."
        },

        // --- 4. TRANSAÇÕES DISTRIBUÍDAS (10 CARDS) ---
        {
            category: "Transações Distribuídas",
            front: "O que é uma **Transação Distribuída**?",
            back: "Uma operação que abrange múltiplos serviços ou bancos de dados independentes, exigindo que todos tenham sucesso ou que todos falhem coletivamente."
        },
        {
            category: "Teorema CAP",
            front: "O que estabelece o **Teorema CAP** para sistemas distribuídos?",
            back: "Em qualquer sistema de dados distribuído, só é possível garantir simultaneamente duas de três propriedades: **Consistência (Consistency), Disponibilidade (Availability) e Tolerância a Partição (Partition Tolerance)**."
        },
        {
            category: "2PC (Two-Phase Commit)",
            front: "O que é o protocolo **2PC (Commit de Duas Fases)** e qual seu calcanhar de Aquiles em microsserviços?",
            back: "Um protocolo síncrono de garantia transacional; o ponto fraco é que ele **bloqueia recursos e é altamente dependente da disponibilidade**, gerando gargalos em arquiteturas modernas."
        },
        {
            category: "Consistência Eventual",
            front: "O que significa **Consistência Eventual** em arquiteturas distribuídas?",
            back: "A garantia de que, se nenhuma nova atualização for feita, todos os réplicas/serviços **eventualmente refletirão o mesmo dado** após um curto intervalo de tempo."
        },
        {
            category: "Padrão Saga",
            front: "O que é o **Padrão Saga** para gerenciamento de transações distribuídas?",
            back: "Uma sequência de transações locais onde cada serviço executa sua etapa e publica um evento; se um passo falha, **transações compensatórias** desfazem os passos anteriores."
        },
        {
            category: "Saga Orquestrada",
            front: "Como funciona uma **Saga baseada em Orquestração**?",
            back: "Um componente centralizador (*Orchestrator*) envia comandos para os serviços participantes e gerencia explicitamente a lógica de compensação em caso de erro."
        },
        {
            category: "Saga Coreografada",
            front: "Como funciona uma **Saga baseada em Coreografia**?",
            back: "Não há coordenador central; cada serviço executa sua transação local e **emite um evento** que o próximo serviço escuta e executa sua parte."
        },
        {
            category: "Transação Compensatória",
            front: "O que é uma **Transação Compensatória** em uma Saga?",
            back: "Uma operação lógica que **desfaz o efeito prático** de uma transação anterior (ex: estornar um pagamento caso o estoque falhe no passo seguinte)."
        },
        {
            category: "Idempotência em Transações",
            front: "Por que a **Idempotência** é obrigatória em APIs de microsserviços que usam reentregas de mensagens?",
            back: "Para garantir que se uma mesma mensagem de transação for entregue duas vezes por falha de rede, **o sistema processe o efeito apenas uma vez**."
        },
        {
            category: "Outbox Pattern",
            front: "O que resolve o **Transactional Outbox Pattern**?",
            back: "Garante a consistência atômica ao salvar dados no banco relacional local e publicar eventos em uma mensageria simultaneamente, evitando perda de mensagens em falhas."
        }
    ];

    let currentIndex = 0;
    const cardElement = document.getElementById('flashcard');
    const categoryElement = document.getElementById('card-category');
    const frontElement = document.getElementById('card-front');
    const backElement = document.getElementById('card-back');
    const trackerElement = document.getElementById('card-tracker');

    function parseFormatting(str) {
        return str.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
    }

    function updateCard() {
        cardElement.classList.remove('is-flipped');
        setTimeout(() => {
            const currentData = cardsData[currentIndex];
            categoryElement.innerText = currentData.category;
            frontElement.innerHTML = parseFormatting(currentData.front);
            backElement.innerHTML = parseFormatting(currentData.back);
            trackerElement.innerText = `Card ${currentIndex + 1} de ${cardsData.length}`;
        }, 150);
    }

    function flipCard() {
        cardElement.classList.toggle('is-flipped');
    }

    function nextCard() {
        currentIndex = (currentIndex + 1) % cardsData.length;
        updateCard();
    }

    function prevCard() {
        currentIndex = (currentIndex - 1 + cardsData.length) % cardsData.length;
        updateCard();
    }

    // Initialize App
    updateCard();

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') nextCard();
        if (e.key === 'ArrowLeft') prevCard();
        if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            flipCard();
        }
    });
    </script>
</body>
</html>
